apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: FCG
  Jwt__Audience: FCG
  Jwt__AccessTokenMinutes: "120"
  Sqs__Region: us-east-1
  Sqs__QueueUrl: "https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/fcg-fase3-user-created"
  AdminSeed__Enabled: "false"
  AdminSeed__Name: FCG Admin
  AdminSeed__Email: admin@fcg.local
