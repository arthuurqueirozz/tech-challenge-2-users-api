apiVersion: v1
kind: Secret
metadata:
  name: users-api-secrets
type: Opaque
stringData:
  ConnectionStrings__UsersDatabase: "Server=sqlserver,1433;Database=FcgUsersDb;User Id=sa;Password=<sql-password>;TrustServerCertificate=True;Encrypt=False"
  Jwt__Key: "<jwt-key-with-at-least-32-bytes>"
  AWS_ACCESS_KEY_ID: "<temporary-users-role-access-key>"
  AWS_SECRET_ACCESS_KEY: "<temporary-users-role-secret-key>"
  AWS_SESSION_TOKEN: "<temporary-users-role-session-token>"
  AdminSeed__Password: "<admin-password>"
